# Deploys the "lab" branch to the lab copy of the site (docker-compose.lab.yml, /var/www/sawt-lab) on the same server.
# The real site is not touched: it keeps deploying from its own branch (deploy.yml).
name: Deploy lab

on:
  push:
    branches: [lab]
  workflow_dispatch:

concurrency:
  group: deploy-lab
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOST: ${{ vars.DEPLOY_HOST || '158.220.97.14' }}
      LAB_DIR: /var/www/sawt-lab
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::Add the DEPLOY_SSH_KEY secret (Settings → Secrets and variables → Actions)"; exit 1; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Copy files
        run: git archive --format=tar HEAD | ssh -i ~/.ssh/id_deploy root@"$HOST" "mkdir -p $LAB_DIR && tar -x -C $LAB_DIR"

      - name: First-time setup (only once)
        run: ssh -i ~/.ssh/id_deploy root@"$HOST" "cd $LAB_DIR && sh scripts/lab-init.sh"

      - name: Build and restart
        run: ssh -i ~/.ssh/id_deploy root@"$HOST" "cd $LAB_DIR && docker compose -p sawt-lab -f docker-compose.lab.yml build && docker compose -p sawt-lab -f docker-compose.lab.yml up -d && docker image prune -f >/dev/null"
