# The lab: a full copy of the site for trying things out, next to the real one and separate from it (its own folder
# /var/www/sawt-lab, data, container and image). No domain: it listens on the server itself only, reached through an
# SSH tunnel (ssh -L 3100:localhost:3100 root@server, then http://localhost:3100). Deployed from the "lab" branch
# (.github/workflows/deploy-lab.yml); scripts/lab-init.sh makes its .env and data the first time.
services:
  sawtik-lab:
    build: .
    image: sawtik-lab:latest
    container_name: sawtik-lab
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - ./data:/app/data
    # The real site keeps the rest of the machine
    cpus: 2
    mem_limit: 3g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
